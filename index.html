<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asset Aura</title>

    <!-- UX4G CSS loaded first in <head> — prevents flash of unstyled widget -->
    <link rel="stylesheet" href="https://cdn.ux4g.gov.in/accessibility-v3.10/accessibility-widget.css">

    <!--
      NUCLEAR INTERCEPT: Override insertAdjacentHTML on <body> BEFORE the UX4G widget
      script runs. The widget calls document.body.insertAdjacentHTML('beforeend', widgetHTML).
      We intercept that call, strip out the upgrade badge, promo section, and "Created by"
      link from the HTML string itself, then let the cleaned HTML be inserted normally.
      This runs BEFORE any DOM is inserted so there is ZERO flash.
    -->
    <script>
      (function () {
        const _origInsert = Element.prototype.insertAdjacentHTML;
        Element.prototype.insertAdjacentHTML = function (position, html) {
          // Only intercept UX4G widget HTML (detected by the uw-main marker)
          if (typeof html === 'string' && html.includes('uw-main')) {
            // Strip the upgrade badge link from the header
            html = html.replace(/<a[^>]*class="[^"]*uw-upgrade-badge[^"]*"[^>]*>[\s\S]*?<\/a>/gi, '');
            // Strip the upgrade promo section
            html = html.replace(/<section[^>]*id="uw-upgrade-promo"[^>]*>[\s\S]*?<\/section>/gi, '');
            // Strip the "Created by" copyright link
            html = html.replace(/<a[^>]*class="[^"]*copyright-text[^"]*"[^>]*>[\s\S]*?<\/a>/gi, '');
          }
          return _origInsert.call(this, position, html);
        };
      })();
    </script>

    <style>
      /* ========================================
         UX4G WIDGET BRANDING & PROMO OVERRIDES
         Class names verified from widget JS source
         ======================================== */

      /* --- Floating trigger button --- */
      .uw-widget-custom-trigger {
        background-color: #d4af37 !important;
        box-shadow: 0px 13px 14px -6px rgba(13, 148, 136, 0.35) !important;
        z-index: 999999 !important;
      }

      /* --- Panel header bar --- */
      .second-panel, .uwaw-header {
        background-color: #d4af37 !important;
      }

      /* --- Active feature states --- */
      .ux4g-accessibility-feature-active .uwaw-features__item__i {
        border-color: #d4af37 !important;
      }
      .ux4g-accessibility-active {
        color: #d4af37 !important;
      }

      /* --- Reset button --- */
      #reset-all-settings,
      #reset-all,
      .btn-reset-all,
      .reset-panel button {
        background-color: #d4af37 !important;
        color: white !important;
      }

      /* --- Icon active overrides --- */
      .ux4g-accessibility-feature-active div[class^="icon-"],
      .ux4g-accessibility-feature-active div[class*=" icon-"] {
        background-color: #d4af37 !important;
      }

      /* CSS backup hide — in case anything slips through the intercept */
      #uw-upgrade-badge, .uw-upgrade-badge,
      #uw-upgrade-promo, .uw-upgrade-promo,
      .copyright-text, .ux4g-copy, .ux4g-copyright, .ux4g-logo {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- UX4G OFFICIAL PREMIUM WIDGET -->
    <script
      src="https://cdn.ux4g.gov.in/tools/accessibility-widget.js"
      data-primary-color="#d4af37"
      data-layout="grid"
      data-no-ticker="true"
      data-header-id="ux4g-safe-header">
    </script>
  </body>
</html>
