<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asset Aura</title>

    <!-- UX4G CSS loaded first in <head> — prevents flash of unstyled widget -->
    <link rel="stylesheet" href="https://cdn.ux4g.gov.in/accessibility-v3.10/accessibility-widget.css">

    <style>
      /* ========================================
         UX4G WIDGET BRANDING & PROMO OVERRIDES
         Class names verified from widget JS source
         ======================================== */

      /* --- Floating trigger button --- */
      .uw-widget-custom-trigger {
        background-color: #d4af37 !important;
        box-shadow: 0px 13px 14px -6px rgba(13, 148, 136, 0.35) !important;
        z-index: 999999 !important;
      }

      /* --- Panel header bar --- */
      .second-panel, .uwaw-header {
        background-color: #d4af37 !important;
      }

      /* --- Active feature states --- */
      .ux4g-accessibility-feature-active .uwaw-features__item__i {
        border-color: #d4af37 !important;
      }
      .ux4g-accessibility-active {
        color: #d4af37 !important;
      }

      /* --- Reset button --- */
      #reset-all-settings,
      #reset-all,
      .btn-reset-all,
      .reset-panel button {
        background-color: #d4af37 !important;
        color: white !important;
      }

      /* --- Icon active overrides --- */
      .ux4g-accessibility-feature-active div[class^="icon-"],
      .ux4g-accessibility-feature-active div[class*=" icon-"] {
        background-color: #d4af37 !important;
      }

      /* ========================================
         HIDE: "Upgrade" badge in header (exact id/class from widget JS)
         ======================================== */
      #uw-upgrade-badge,
      .uw-upgrade-badge {
        display: none !important;
      }

      /* ========================================
         HIDE: "Enhanced Accessibility" promo section (exact id/class)
         ======================================== */
      #uw-upgrade-promo,
      .uw-upgrade-promo {
        display: none !important;
      }

      /* ========================================
         HIDE: "Created by" footer link (exact class from widget JS)
         .copyright-text = the <a> wrapper
         .ux4g-copy / .ux4g-copyright = "Created by" text span
         .ux4g-logo = UX4G logo span
         ======================================== */
      .copyright-text,
      .ux4g-copy,
      .ux4g-copyright,
      .ux4g-logo {
        display: none !important;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

    <!-- UX4G OFFICIAL PREMIUM WIDGET -->
    <script
      src="https://cdn.ux4g.gov.in/tools/accessibility-widget.js"
      data-primary-color="#d4af37"
      data-layout="grid"
      data-no-ticker="true"
      data-header-id="ux4g-safe-header">
    </script>

    <!-- SAFETY NET: DOM removal for any elements that escape CSS hiding -->
    <script>
      (function () {
        const cleanWidget = () => {
          // Remove upgrade badge + promo (exact IDs/classes from widget source)
          ['#uw-upgrade-badge', '.uw-upgrade-badge',
           '#uw-upgrade-promo', '.uw-upgrade-promo',
           '.copyright-text', '.ux4g-logo'
          ].forEach(sel => {
            document.querySelectorAll(sel).forEach(el => el.remove());
          });
        };

        cleanWidget();
        window.addEventListener('DOMContentLoaded', cleanWidget);
        window.addEventListener('load', () => {
          cleanWidget();
          setTimeout(cleanWidget, 400);
          setTimeout(cleanWidget, 1200);
        });
        new MutationObserver(cleanWidget).observe(document.documentElement, {
          childList: true, subtree: true
        });
      })();
    </script>
  </body>
</html>
