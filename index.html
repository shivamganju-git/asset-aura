    <script>

    <style>
      /* =====================================================
         ZERO-FLASH FIX: Inline critical CSS for UX4G widget
         Pre-positions all elements properly before CDN loads.
         ===================================================== */

      /* Main widget panel — starts off-screen to the right.
         No !important on 'right' so widget JS can slide it in on click. */
      #uw-main {
        position: fixed !important;
        top: 0 !important;
        right: -600px;
        width: 530px !important;
        height: 100vh !important;
        overflow: hidden !important;
        z-index: 999998 !important;
        transition: right 0.3s ease !important;
      }

      /* Floating trigger button — FIXED at bottom-right immediately */
      #uw-widget-custom-trigger,
      .uw-widget-custom-trigger {
        position: fixed !important;
        bottom: 24px !important;
        right: 20px !important;
        z-index: 999999 !important;
        background-color: #d4af37 !important;
        color: #ffffff !important;
        border: none !important;
        border-radius: 70px !important;
        cursor: pointer !important;
        height: 70px !important;
        padding: 18px !important;
        display: flex !important;
        align-items: center !important;
        overflow: hidden !important;
        width: auto !important;
        max-width: 70px !important;
        text-align: left !important;
        box-shadow: 0px 13px 14px -6px rgba(13, 148, 136, 0.35) !important;
        transition: max-width 400ms ease !important;
      }

      .uw-widget-custom-trigger:hover {
        max-width: 300px !important;
      }

      .uw-widget-custom-trigger img {
        width: 25px !important;
        height: 25px !important;
        margin-left: 5px !important;
        margin-top: -10px !important;
      }

      .uw-widget-custom-trigger span {
        white-space: nowrap !important;
        padding-left: 5px !important;
        font-size: 15px !important;
        opacity: 0 !important;
        transition: opacity 300ms ease !important;
      }

      .uw-widget-custom-trigger:hover span {
        opacity: 1 !important;
      }

      .uw-widget-custom-trigger .short-key {
        position: absolute !important;
        bottom: 12px !important;
        color: #ffffff !important;
        right: 15px !important;
        font-size: 11px !important;
        left: 17px !important;
        cursor: pointer !important;
      }

      /* Skip-link overlay — hide off-screen */
      #accessibility-overlay {
        position: absolute !important;
        left: -9999px !important;
        top: auto !important;
        width: 1px !important;
        height: 1px !important;
        overflow: hidden !important;
      }

      /* =====================================================
         UX4G BRAND OVERRIDES
         ===================================================== */

      /* Panel header bar */
      .second-panel,
      .uwaw-header {
        background-color: #d4af37 !important;
      }

      /* Active feature states */
      .ux4g-accessibility-feature-active .uwaw-features__item__i {
        border-color: #d4af37 !important;
      }

      .ux4g-accessibility-active {
        color: #d4af37 !important;
      }

      /* Reset / Reset All button */
      #reset-all-settings,
      #reset-all,
      .btn-reset-all,
      .reset-panel button {
        background-color: #d4af37 !important;
        color: white !important;
      }

      /* =====================================================
         HIDE: Upgrade badge, promo banner, "Created by" credit
         ===================================================== */
      #uw-upgrade-badge,
      .uw-upgrade-badge,
      #uw-upgrade-promo,
      .uw-upgrade-promo,
      .copyright-text,
      .ux4g-copy,
      .ux4g-copyright,
      .ux4g-logo {
        display: none !important;
      }
    </style>

    <!-- UX4G Official CSS (valid 200 URL) loaded in <head> -->
    <link rel="stylesheet" href="https://cdn.ux4g.gov.in/tools/accessibility-widget.css">

    <!-- INTERCEPT: Strip upgrade/branding HTML BEFORE it's inserted into DOM -->
    <script>
      (function () {
        const originalSiteTitle = "Asset Aura";

        const _orig = Element.prototype.insertAdjacentHTML;
        Element.prototype.insertAdjacentHTML = function (pos, html) {
          if (typeof html === 'string' && html.includes('uw-main')) {
            // Strip <title> tag so UX4G never overwrites the browser tab title
            html = html.replace(/<title>[\s\S]*?<\/title>/gi, '');
            // Strip duplicate <!DOCTYPE>, <html>, <head>, <body> tags
            html = html.replace(/<!DOCTYPE[^>]*>/gi, '');
            html = html.replace(/<\/?(html|head|body)[^>]*>/gi, '');
            // Remove upgrade badge
            html = html.replace(/<a[^>]*class="[^"]*uw-upgrade-badge[^"]*"[^>]*>[\s\S]*?<\/a>/gi, '');
            // Remove upgrade promo section
            html = html.replace(/<section[^>]*id="uw-upgrade-promo"[^>]*>[\s\S]*?<\/section>/gi, '');
            // Remove "Created by" copyright link
            html = html.replace(/<a[^>]*class="[^"]*copyright-text[^"]*"[^>]*>[\s\S]*?<\/a>/gi, '');
          }
          const res = _orig.call(this, pos, html);

          // Restore site title if UX4G overwrites it
          if (document.title.includes('UX4G')) {
            document.title = originalSiteTitle;
          }
          return res;
        };

        // Watcher to prevent document.title from ever being changed to UX4G
        const titleWatcher = new MutationObserver(() => {
          if (document.title.includes('UX4G')) {
            document.title = originalSiteTitle;
          }
        });
        const titleTag = document.querySelector('title');
        if (titleTag) {
          titleWatcher.observe(titleTag, { childList: true, characterData: true, subtree: true });
        }
      })();
    </script>
