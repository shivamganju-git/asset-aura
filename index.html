<!DOCTYPE html>
<html lang="en">

  <!-- UX4G CSS loaded first in <head> — prevents flash of unstyled widget -->
  <link rel="stylesheet" href="https://cdn.ux4g.gov.in/accessibility-v3.10/accessibility-widget.css">

  <!--
      INLINE CSS MUST come BEFORE the CDN link.
      These rules use NO external resources — they apply instantly and
      keep the widget panel and overlay invisible until CDN CSS loads.
    -->
    <style>
      /* =====================================================
         ZERO-FLASH FIX: Pre-position widget elements OFF-SCREEN
         using INLINE CSS (no CDN needed, applies immediately).
         The CDN stylesheet overrides these once it loads.
         ===================================================== */

      /* Main widget panel — keep it off-screen to the right.
         NO !important on 'right' — allows the widget JS to override
         it with element.style.right = '0' when user clicks the button. */
      #uw-main {
        position: fixed !important;
        top: 0 !important;
        right: -600px;         /* no !important — JS can override this */
        width: 530px !important;
        height: 100vh !important;
        overflow: hidden !important;
        z-index: 999998 !important;
        transition: right 0.3s ease !important;
      }

      /* Floating trigger button — gold color only, let widget handle position */
      .uw-widget-custom-trigger {
        background-color: #d4af37 !important;
        box-shadow: 0px 13px 14px -6px rgba(13, 148, 136, 0.35) !important;
        z-index: 999999 !important;
      }

      /* Skip-link overlay — visually hide, keep accessible */
      #accessibility-overlay {
        position: absolute !important;
        left: -9999px !important;
        top: auto !important;
        width: 1px !important;
        height: 1px !important;
        overflow: hidden !important;
      }

      /* =====================================================
         UX4G BRAND OVERRIDES (verified class names from source)
         ===================================================== */

      /* Panel header bar */
      .second-panel, .uwaw-header {
        background-color: #d4af37 !important;
      }

      /* Active feature states */
      .ux4g-accessibility-feature-active .uwaw-features__item__i {
        border-color: #d4af37 !important;
      }
      .ux4g-accessibility-active {
        color: #d4af37 !important;
      }

      /* Reset / Reset All button */
      #reset-all-settings,
      #reset-all,
      .btn-reset-all,
      .reset-panel button {
        background-color: #d4af37 !important;
        color: white !important;
      }

      /* =====================================================
         HIDE: Upgrade badge, promo banner, "Created by" credit
         (class names verified directly from UX4G widget JS source)
         ===================================================== */
      #uw-upgrade-badge,
      .uw-upgrade-badge,
      #uw-upgrade-promo,
      .uw-upgrade-promo,
      .copyright-text,
      .ux4g-copy,
      .ux4g-copyright,
      .ux4g-logo {
        display: none !important;
      }
    </style>

    <!-- UX4G CSS — loaded in <head> so it applies before body renders -->
    <link rel="stylesheet" href="https://cdn.ux4g.gov.in/accessibility-v3.10/accessibility-widget.css">

    <!-- INTERCEPT: Strip upgrade/branding HTML BEFORE it's inserted into DOM -->
    <script>
      (function () {
        const _orig = Element.prototype.insertAdjacentHTML;
        Element.prototype.insertAdjacentHTML = function (pos, html) {
          if (typeof html === 'string' && html.includes('uw-main')) {
            // Remove upgrade badge
            html = html.replace(/<a[^>]*class="[^"]*uw-upgrade-badge[^"]*"[^>]*>[\s\S]*?<\/a>/gi, '');
            // Remove upgrade promo section
            html = html.replace(/<section[^>]*id="uw-upgrade-promo"[^>]*>[\s\S]*?<\/section>/gi, '');
            // Remove "Created by" copyright link
            html = html.replace(/<a[^>]*class="[^"]*copyright-text[^"]*"[^>]*>[\s\S]*?<\/a>/gi, '');
          }
          return _orig.call(this, pos, html);
        };
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>

  <!-- UX4G OFFICIAL PREMIUM WIDGET -->
  <script src="https://cdn.ux4g.gov.in/tools/accessibility-widget.js" data-primary-color="#d4af37" data-layout="grid"
    data-no-ticker="true" data-header-id="ux4g-safe-header">
    </script>
</body>
</html>
